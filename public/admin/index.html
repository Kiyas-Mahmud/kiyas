<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Site Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%230b0f1c' stroke='%23f0a64b' stroke-width='1.5'/%3E%3Cpath d='M10 8v16M10 16l9-8M13 13.5L21 24' fill='none' stroke='%23f0a64b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Schibsted+Grotesk:wght@400;500;700&family=Martian+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!-- Login -->
    <main class="login" id="loginView" hidden>
      <form class="login-card" id="loginForm">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Site admin</h1>
        <p class="muted">Sign in to edit kiyas.me.</p>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required autofocus />
        <button class="btn btn-solid" type="submit">Sign in</button>
        <p class="form-error" id="loginError" role="alert"></p>
      </form>
    </main>

    <!-- Editor -->
    <div class="app" id="appView" hidden>
      <aside class="side">
        <div class="side-head">
          <span class="brand-mark" aria-hidden="true"></span>
          <strong>Site admin</strong>
        </div>
        <nav class="side-nav" id="sideNav" aria-label="Sections"></nav>
        <div class="side-foot">
          <a class="side-link" href="/" target="_blank" rel="noopener"
            ><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> View site</a
          >
          <button class="side-link" id="logoutBtn" type="button">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sign out
          </button>
        </div>
      </aside>

      <main class="editor">
        <header class="editor-head">
          <div>
            <h1 id="sectionTitle"></h1>
            <p class="muted" id="sectionHint"></p>
          </div>
        </header>
        <form id="sectionForm" class="form" novalidate></form>
        <div class="savebar">
          <span class="save-status" id="saveStatus" role="status"></span>
          <button class="btn btn-solid" id="saveBtn" type="button">
            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save section
          </button>
        </div>
      </main>
    </div>

    <script type="module" src="/admin/admin.js"></script>
  </body>
</html>
