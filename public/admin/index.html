<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>kiyas.me Admin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='7' fill='%230b0f1c' stroke='%23f0a64b' stroke-width='1.5'/%3E%3Cpath d='M10 8v16M10 16l9-8M13 13.5L21 24' fill='none' stroke='%23f0a64b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Schibsted+Grotesk:wght@400;500;700&family=Martian+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/admin/admin.css?v=2" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- Boot -->
    <div class="boot" id="bootView">
      <span class="spinner" aria-hidden="true"></span>
      <span class="sr-only">Loading…</span>
    </div>

    <!-- Login -->
    <main class="login" id="loginView" hidden>
      <form class="login-card" id="loginForm">
        <div class="monogram" aria-hidden="true">K</div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to edit <strong>kiyas.me</strong></p>

        <label class="f-label" for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" type="password" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" title="Show password">
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
          </button>
        </div>
        <p class="form-error" id="loginError" role="alert"></p>

        <button class="btn btn-solid btn-block" type="submit" id="loginBtn">
          <span>Sign in</span> <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </button>
        <a class="back-link" href="/"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to site</a>
      </form>
    </main>

    <!-- Editor -->
    <div class="app" id="appView" hidden>
      <aside class="side" id="side">
        <div class="side-head">
          <div class="monogram monogram-sm" aria-hidden="true">K</div>
          <div>
            <strong>kiyas.me</strong>
            <span class="side-sub">Content admin</span>
          </div>
          <button class="icon-btn side-close" id="sideClose" type="button" aria-label="Close menu">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <nav class="side-nav" id="sideNav" aria-label="Sections"></nav>
        <div class="side-foot">
          <a class="side-link" href="/" target="_blank" rel="noopener">
            <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> View live site
          </a>
          <button class="side-link" id="logoutBtn" type="button">
            <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sign out
          </button>
        </div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="topbar-title">
            <p class="crumb mono" id="crumb"></p>
            <h1 id="sectionTitle"></h1>
          </div>
          <div class="topbar-actions">
            <span class="saved-at" id="savedAt"></span>
            <a class="btn btn-ghost" id="previewBtn" href="/" target="_blank" rel="noopener">
              <i class="fa-regular fa-eye" aria-hidden="true"></i><span class="hide-sm"> Preview</span>
            </a>
            <button class="btn btn-solid" id="saveBtn" type="button" disabled>
              <i class="fa-solid fa-check" aria-hidden="true"></i> <span id="saveLabel">Saved</span>
            </button>
          </div>
        </header>

        <div class="content">
          <p class="section-hint" id="sectionHint"></p>
          <form id="sectionForm" class="form" novalidate></form>
        </div>
      </main>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="/admin/admin.js?v=2"></script>
  </body>
</html>
